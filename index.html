<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadratic Equation Solver</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; background: #f2f6f7; color: #17283a; }
  h1 { margin-bottom: 4px; }
  .box { background: #fff; border: 2px solid #b9cad3; border-left: 6px solid #2457c5; border-radius: 4px; padding: 16px; margin-top: 16px; }
  label { display: inline-block; margin: 0 10px 10px 0; font-weight: bold; }
  input { width: 90px; padding: 8px; font-size: 1rem; display: block; margin-top: 4px; }
  button { padding: 10px 22px; font-size: 1rem; font-weight: bold; background: #17283a; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  #steps div { padding: 3px 0; font-family: Consolas, monospace; }
  #answer { margin-top: 10px; padding: 10px; background: #eef6f1; border-left: 5px solid #17704f; color: #17704f; font-weight: bold; }
  .error { color: #b3261e; font-weight: bold; }
</style>
</head>
<body>
  <h1>Quadratic Equation Solver</h1>
  <p>Solves ax² + bx + c = 0</p>

  <div class="box">
    <label>a <input id="a" type="number" step="any" value="1"></label>
    <label>b <input id="b" type="number" step="any" value="-3"></label>
    <label>c <input id="c" type="number" step="any" value="2"></label>
    <br>
    <button onclick="solve()">Solve</button>
  </div>

  <div class="box">
    <div id="steps">Press Solve to see the working.</div>
    <div id="answer"></div>
  </div>

  <script>
    function fmt(n) {
      return String(parseFloat(Number(n).toPrecision(10)));
    }

    function addLine(text) {
      var d = document.createElement("div");
      d.textContent = text;
      document.getElementById("steps").appendChild(d);
    }

    function solve() {
      var a = parseFloat(document.getElementById("a").value);
      var b = parseFloat(document.getElementById("b").value);
      var c = parseFloat(document.getElementById("c").value);
      var steps = document.getElementById("steps");
      var answer = document.getElementById("answer");
      steps.textContent = "";
      answer.className = "";
      answer.textContent = "";

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        answer.className = "error";
        answer.textContent = "Enter a number in all three boxes.";
        return;
      }
      if (a === 0) {
        answer.className = "error";
        answer.textContent = "a cannot be 0, because then it is not a quadratic.";
        return;
      }

      var D = b * b - 4 * a * c;
      addLine("Equation: " + fmt(a) + "x² + " + fmt(b) + "x + " + fmt(c) + " = 0");
      addLine("Discriminant: D = b² - 4ac = " + fmt(D));

      if (D > 0) {
        var r = Math.sqrt(D);
        var x1 = (-b + r) / (2 * a);
        var x2 = (-b - r) / (2 * a);
        addLine("D > 0: two real roots.");
        addLine("x = (-b ± √D) / 2a");
        answer.textContent = "x1 = " + fmt(x1) + "   and   x2 = " + fmt(x2);
      } else if (D === 0) {
        addLine("D = 0: one repeated root.");
        answer.textContent = "x = " + fmt(-b / (2 * a));
      } else {
        var re = -b / (2 * a);
        var im = Math.sqrt(-D) / (2 * Math.abs(a));
        addLine("D < 0: no real roots, the roots are complex.");
        answer.textContent = "x = " + fmt(re) + " ± " + fmt(im) + "i";
      }
    }

    solve();
  </script>
</body>
</html>
