<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problem Solver: step-by-step math help</title>
<meta name="description" content="Free tools that solve math problems and show every step.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#f2f6f7;--grid:#d3e1e6;--ink:#17283a;--muted:#55687a;--accent:#2457c5;--ok:#17704f;--bad:#b3261e;--field:#fff;--line:#b9cad3}
@media (prefers-color-scheme:dark){:root{--paper:#10191f;--grid:#1c2b34;--ink:#e6eef2;--muted:#93a6b3;--accent:#7fa6ff;--ok:#5fd0a2;--bad:#ff8a80;--field:#16232b;--line:#2e414d;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,'Segoe UI',sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header{background:var(--paper);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent)}
nav a{color:var(--ink);text-decoration:none;font-weight:600;margin-left:18px}
nav a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:56px 0 48px}
h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:800;letter-spacing:-.035em;line-height:.98;margin:0 0 16px}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:1.15rem;color:var(--muted);max-width:44ch;margin:0 0 24px}
.btn{display:inline-block;font:inherit;font-weight:800;padding:12px 24px;border:0;border-radius:4px;background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none}
.demo{background:var(--field);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:4px;padding:18px 20px;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:.92rem}
.demo b{font-family:'Bricolage Grotesque',system-ui,sans-serif;display:block;margin-bottom:8px}
.demo div{padding:2px 0}.demo .a{margin-top:8px;color:var(--ok);font-weight:500}
section{padding:40px 0}
h2{font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{font:inherit;font-weight:600;padding:8px 14px;border:2px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.sheet{background:var(--field);border:2px solid var(--line);border-left:6px solid var(--accent);padding:20px 22px;border-radius:4px}
.sheet h3{margin:0 0 2px;font-size:1.3rem}.hint{margin:0 0 16px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem;flex:1 1 120px}
input,select,textarea{font:inherit;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;padding:9px 10px;border:2px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);width:100%}
#out{margin-top:18px;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:.95rem;overflow-x:auto}
#out div{padding:3px 0}
#out .ans{margin-top:10px;padding:10px 12px;border-left:5px solid var(--ok);background:var(--paper);font-weight:500;font-size:1.05rem;color:var(--ok)}
#out .err{color:var(--bad);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--field);border:2px solid var(--line);border-radius:4px;padding:16px}
.steps li::before{content:counter(s);display:block;font-weight:800;font-size:2rem;color:var(--accent);line-height:1}
.steps b{display:block;margin:6px 0 2px}
.contact{max-width:560px;display:grid;gap:12px}
footer{border-top:2px solid var(--line);background:var(--paper);padding:20px 0;color:var(--muted);text-align:center;font-size:.9rem}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding-top:36px}.steps{grid-template-columns:1fr}nav a{margin:0 14px 0 0}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#top">Problem<span>Solver</span></a>
  <nav><a href="#solve">Solve</a><a href="#how">How it works</a><a href="#contact">Contact</a></nav>
</div></header>

<main id="top">
<div class="wrap">
  <div class="hero">
    <div>
      <h1>Break any problem into <em>steps.</em></h1>
      <p class="lead">Free tools that solve math problems and show every step.</p>
      <a class="btn" href="#solve">Start solving</a>
